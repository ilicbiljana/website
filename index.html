<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vercel Test Deployment</title>
    <style>
      :root {
        color-scheme: light;
        --bg: linear-gradient(135deg, #f4efe6 0%, #dbe9f4 100%);
        --card: rgba(255, 255, 255, 0.88);
        --text: #1f2937;
        --muted: #526072;
        --accent: #d97706;
        --border: rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(100%, 720px);
        padding: 48px 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 20px 60px rgba(31, 41, 55, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.05;
      }

      p {
        margin: 0 auto;
        max-width: 42ch;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .badge {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(217, 119, 6, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Deployment Test</div>
      <h1>Vercel is serving this site.</h1>
      <p>
        This is a starter landing page for your new project. If you can see this
        after deploying, your repo and Vercel setup are working correctly.
      </p>
    </main>
  </body>
</html>
